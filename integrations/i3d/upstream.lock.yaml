integration_notes:
  - I3D-R50 是固定 clip RGB 路线；adapter 不声明 streaming 或任何 cache。
  - checkpoint 只能由服务器预先下载到 local_dir；adapter 不调用 torch.hub。
  - 产物的 pooled 表征来自分类头之前的最后 backbone block（若该 block 可观察）。
