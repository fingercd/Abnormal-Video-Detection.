integration_notes:
  - SlowFast-R50 是固定 clip 双路径 RGB 路线；adapter 将 BCTHW 转为 [slow, fast]。
  - slow pathway 默认每 4 个 fast 帧取 1 帧；alpha 可通过构造参数调整。
  - checkpoint 只能由服务器预先下载到 local_dir；adapter 不调用 torch.hub。
