integration_notes:
  - HERMES 将视频视觉 token 写入语言模型并维护 decoder past_key_values。
  - 适配器暴露的是 decoder KV cache；不得描述为 vision encoder KV cache。
  - 投影后视觉 token 与 decoder KV 遥测分开输出，便于分类与缓存压缩实验。
  - 官方原生层次压缩入口是 predict_and_compress/pseudo_forward；它会增加伪查询注意力计算，且其 VideoQA 保留策略对稀疏 VAD 证据的有效性仍需实测。
