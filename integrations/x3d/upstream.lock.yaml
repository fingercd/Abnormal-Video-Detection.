integration_notes:
  - X3D-S 是固定 clip RGB 路线；adapter 不声明 streaming 或任何 cache。
  - checkpoint 只能由服务器预先下载到 local_dir；adapter 不调用 torch.hub。
  - 公开变体的 nominal 采样为 13 帧、stride 6、crop 182，实际采样由框架 sampler 负责。
