schema_version: 1
name: mvitv2
adapter: mvitv2
family: fixed_clip

constructor:
  variant: mvit_v2_s
  checkpoint_path: weights/mvitv2/model.pth
  clip_frames: 16
  frame_stride: 2
  image_size: 224
  feature_stage: pooled
  strict_checkpoint: false

checkpoint:
  constructor_key: checkpoint_path
  source: torchvision
  model_id: torchvision.models.video.mvit_v2_s
  revision: v0.20.1
  license: BSD-3-Clause
  local_path: weights/mvitv2/model.pth

upstream_lock: integrations/mvitv2/upstream.lock.yaml
