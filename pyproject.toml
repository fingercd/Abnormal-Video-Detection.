[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vadbench"
version = "0.1.0"
description = "可插拔的视频编码器、UCF-Crime 训练评测与缓存压缩实验框架"
readme = "README-CN.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "fingercd" }]
dependencies = [
  "huggingface-hub>=0.27,<2",
  "jsonschema>=4.23",
  "numpy>=1.24,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
video = [
  "opencv-python-headless>=4.8",
]
train = [
  "torch>=2.2",
  "scikit-learn>=1.3",
  "safetensors>=0.4",
]
videomaev2 = [
  "easydict>=1.13",
  "torch>=2.2",
  "timm>=1.0",
  "transformers>=4.46,<6",
  "Pillow>=10",
]
# HERMES uses the revision-locked v2 runtime registry; it is not a generic pip extra.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
vadbench = "vadbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vadbench"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "vadbench/resources/configs"
"registry" = "vadbench/resources/registry"
"schemas" = "vadbench/resources/schemas"
"integrations" = "vadbench/resources/integrations"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
